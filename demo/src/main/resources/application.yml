server:
  port: 8080

spring:
  application:
    name: demo

  datasource:
    # 本地默认：H2 文件库（无需 MySQL 也能跑）
    # 勿用 DATABASE_TO_LOWER 等开关打开旧库文件，易导致 H2 恢复失败（Schema "PUBLIC" not found）。
    # 若曾用过旧路径 ./data/demo，可手动删除 demo 目录下 .mv.db / .trace.db 后重试。
    url: jdbc:h2:file:./data/bitdance-h2;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  sql:
    init:
      mode: always
      schema-locations:
        - classpath:db/schema-users.sql
        - classpath:db/schema-community.sql

  h2:
    console:
      enabled: true
      path: /h2-console

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

bitdance:
  jwt:
    secret: "dev-secret-change-me-dev-secret-change-me"
    expires-seconds: 604800

---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/qtrading?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      schema-locations:
        - classpath:db/schema-users.sql
        - classpath:db/schema-community.sql
