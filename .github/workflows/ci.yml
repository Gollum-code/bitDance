name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  python-backend:
    name: Python 后端（8080）冒烟测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bitDance_Object/backend
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: 编译检查
        run: python -m py_compile main.py

      - name: 接口冒烟测试
        run: python -m pytest tests -q

  python-trader:
    name: Python 回测引擎（trader）冒烟测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pandas pytest vnpy vnpy_ctastrategy

      - name: 编译检查
        run: |
          python -m py_compile trader/main.py trader/routers/*.py trader/examples/cta_backtesting/run_rewritten_strategy_backtest.py
          python -m py_compile trader/examples/cta_backtesting/rewritten_strategies/family_*.py

      - name: 回测引擎测试
        run: python -m pytest trader/tests -q

  frontend:
    name: 前端类型检查与构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bitDance_Object
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: bitDance_Object/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npx vue-tsc --noEmit

      - name: 构建
        run: npm run build
